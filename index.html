<html lang="hu">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éjféli Tanú</title>
<meta name="description" content="Titkos szerepes gyilkosos nyomozós partijáték 4-6 főre, mindenki a saját telefonján.">
<meta name="theme-color" content="#121016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="catalog.js"></script>
<style>
:root{
  --bg:#121016; --panel:#1c1922; --panel2:#25212d; --line:#3a3444;
  --text:#ece6dc; --muted:#a59cad; --gold:#d9b46a; --gold2:#f0d79c;
  --red:#d2554d; --green:#6fbf8a; --blue:#7aa7d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  background:radial-gradient(ellipse at top,#2a2030 0%,var(--bg) 60%) fixed;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}  /* iOS Safari top bar overlaps the page with viewport-fit=cover (Márk 2026-10-24) */
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.2}
h1{font-size:2.2rem;color:var(--gold2)} h2{font-size:1.45rem;color:var(--gold2)} h3{font-size:1.05rem;color:var(--gold)}
p{margin:.4em 0 .9em}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border:0;border-radius:12px;font:600 1.02rem Inter,sans-serif;
  background:var(--gold);color:#1a1410;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:1rem Inter,sans-serif}
label{display:block;margin:8px 0 4px;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:.92rem}
.chip.on{background:var(--gold);color:#1a1410;border-color:var(--gold)}
.story{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--panel2)}
.story.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:#2f3a2f;color:var(--green)}
.badge.red{background:#3a2424;color:#f19a92} .badge.blue{background:#22303f;color:var(--blue)} .badge.gold{background:#3a3020;color:var(--gold2)}
.qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin:10px auto}
/* reading */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.bar>i{transition:width .25s linear,background .4s}
.bar.low>i{background:linear-gradient(90deg,#c0392b,#e8574a);box-shadow:0 0 10px #e8574a88}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.steps{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
.steps b{color:var(--gold2)}
.pfp{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:2px solid var(--gold);background:#2a2430}
.kv{margin:10px 0}
.kv b{display:block;color:var(--gold);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.role{font:800 1.6rem "Playfair Display",serif;letter-spacing:.04em}
.role.G,.role.B{color:#f19a92} .role.S{color:var(--blue)} .role.N{color:var(--green)}
/* scene */
#scene{position:fixed;inset:0;overflow:hidden;background:#0d0b10}
#scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.62) saturate(.9)}
#scene .bg.none{background:radial-gradient(ellipse at 50% 55%,#3a2a36 0%,#16121a 70%)}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:3}
.hbtn{width:52px;height:52px;border-radius:14px;border:1px solid #ffffff30;background:#00000070;color:#fff;font-size:1.5rem;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.hright{display:flex;flex-direction:column;gap:8px}
#clock{width:min(34vw,150px);height:min(34vw,150px);filter:drop-shadow(0 4px 16px #0009)}
#clock.urgent{animation:pulse 1s infinite}
#clock.paused{opacity:.75}
@keyframes pulse{50%{transform:scale(1.05)}}
.stage{position:absolute;left:0;right:0;top:calc(min(34vw,150px) + 30px);bottom:calc(58px + env(safe-area-inset-bottom));z-index:2}
.tray{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:3;pointer-events:none}
.tray .tk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:1.5px solid #fff;box-shadow:0 2px 6px #000a;transition:background .3s,opacity .3s}
.tray .tk .ic{width:19px;height:19px}
.tray .tk.used{background:#4a4650;opacity:.55;border-color:#ffffff55}
.victim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#e6c7c2;font-size:.8rem;pointer-events:none}
.victim .vb{font-size:2.2rem;opacity:.7}
.victim.img .vb,.victim.img .vn{visibility:hidden}
/* Windows-help style "?" on the body in the middle of the scene: opens the story facts */
.helpq{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% - min(10vh,90px)));width:46px;height:46px;border-radius:12px;border:1px solid #ffffff44;background:#00000040;color:#c9c4bc;opacity:.75;display:grid;place-items:center;cursor:pointer;z-index:2;padding:0;backdrop-filter:blur(2px)}
.helpq .ic{width:26px;height:26px;stroke-width:2.4}
.ch{position:absolute;width:min(31vw,124px);transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.ch .av{width:min(22vw,88px);height:min(22vw,88px);margin:0 auto;border-radius:50%;overflow:hidden;border:2px solid #ffffffaa;box-shadow:0 4px 14px #000c;background:#2a2430;position:relative}
.ch .av img{position:absolute;width:210%;left:-55%;top:-6%;max-width:none}
.avw{position:relative;width:min(22vw,88px);margin:0 auto}

.ch .nw{font-style:normal;white-space:nowrap}
.ch .mk{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--c);border:1px solid #fff;vertical-align:-.22em;margin-left:4px;box-shadow:0 1px 3px #000a;line-height:0}
.ch .mk .ic{width:.72em;height:.72em}
.ballot .vrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin:8px 0;cursor:pointer}
.ballot .vrow.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2c2316}
.ballot .vrow .av{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;flex:0 0 auto;border:2px solid #ffffff55;background:#2a2430}
.ballot .vrow .av img{position:absolute;width:210%;left:-55%;top:-6%;max-width:none}
.ballot .vrow .nm{flex:1;min-width:0}.ballot .vrow .nm b{display:block}.ballot .vrow .nm small{color:var(--muted);font-size:.8rem}
.ballot .mymk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--c);font-weight:600;flex:0 0 auto}
.ballot .mymk i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.ballot .mymk .ic{width:15px;height:15px}
.reveal{position:fixed;inset:0;z-index:5;overflow:auto;background:#000}
.reveal .rvbg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:grayscale(1) contrast(1.15) brightness(.6);animation:rvzoom 6s ease-out both}
@keyframes rvzoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.reveal::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#0000 25%,#000c 62%,#000f);pointer-events:none}
.reveal .rvin{position:relative;z-index:2;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;padding:40vh 18px calc(22px + env(safe-area-inset-bottom));text-align:center;max-width:560px;margin:0 auto}
.reveal .rvname{font:700 2.1rem 'Playfair Display',serif;color:#fff;margin:0 0 4px;text-shadow:0 2px 12px #000}
.reveal .rvrole{font:800 1.7rem 'Playfair Display',serif;margin:6px 0;text-shadow:0 2px 12px #000;letter-spacing:.02em}
.reveal p{color:#eee;text-shadow:0 1px 6px #000}
.reveal .ballot{text-align:left}
.reveal.done .rvin{justify-content:flex-start;padding-top:calc(14vh + env(safe-area-inset-top))}
.reveal.done::after{background:linear-gradient(180deg,#0006,#000d 45%,#000f)}
.reveal .rvmore{text-align:left;background:#000a;border:1px solid #ffffff22;border-radius:14px;padding:4px 14px;margin:8px 0}
.reveal .rvmore .tog{border-top:0;margin:0}.reveal .rvmore .tog+.tog{border-top:1px solid #ffffff22}
.lies{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.lie{display:block;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;color:inherit;font:inherit;font-size:1rem;cursor:pointer}
.lie small{display:block;margin-top:4px;color:#e8913a;font-size:.8rem}
.lie.on{border-color:var(--gold2);background:#d9b46a26;box-shadow:0 0 0 2px #d9b46a55}
.rvroles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:22px 0 8px}
.rvroles .rr{display:flex;flex-direction:column;align-items:center;gap:3px}
.rvroles .av{width:68px;height:68px;border-radius:50%;overflow:hidden;position:relative;border:2px solid #ffffff66;background:#2a2430}
.rvroles .av img{position:absolute;width:210%;left:-55%;top:-6%;max-width:none}
.rvroles i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;border:1.5px solid #fff;margin-top:-14px;position:relative}
.rvroles i .ic{width:15px;height:15px}
.rvroles small{font-size:.74rem;line-height:1.15;color:#fff}.rvroles small.muted{color:#bbb;font-size:.66rem;letter-spacing:.05em}
.suspick{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.suspick b{display:block;color:var(--gold);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.suspick .opts{display:flex;gap:6px}
.suspick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font:600 .7rem Inter,sans-serif;cursor:pointer}
.suspick button i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffffff14;color:var(--c)}
.suspick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel2));color:#fff}
.suspick button.on i{background:var(--c);color:#fff}
.ch span{display:block;font-size:.8rem;line-height:1.2;margin-top:10px;position:relative;z-index:3;text-shadow:0 1px 4px #000;color:#fff}
.ch.me .av{border:3px solid #f0d79c;box-shadow:0 0 0 3px #1a1410,0 0 0 5px #d9b46a,0 0 0 6px #1a1410,0 0 0 7px #d9b46a88,0 0 22px 6px #d9b46a77,0 4px 14px #000c}
.ch.me>span{color:var(--gold2);font-weight:700}
.subs{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;background:#000000b8;border:1px solid #ffffff22;border-radius:14px;padding:14px;max-height:46vh;overflow:auto}
.modal{position:fixed;inset:0;z-index:20;background:#000000d8;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:1.6rem;cursor:pointer}
.zoomimg{width:100%;border-radius:12px;cursor:zoom-in;display:block}
.zoomwrap{overflow:auto;border-radius:12px;max-height:60vh;touch-action:pan-x pan-y pinch-zoom}
.zoomwrap.z .zoomimg{width:260%;max-width:none;cursor:zoom-out}
.tipbox{border:2px solid var(--gold);text-align:left}
.tipbox h2{color:var(--gold2)}
textarea{width:100%;min-height:42vh;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fbf6ea;color:#2b2233;font:1rem/1.5 Georgia,serif}
.sus{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sus button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:6px 10px;font-size:.82rem}
.sus button.s1{background:#4a2a26;border-color:var(--red)} .sus button.s2{background:#24382a;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid .c{text-align:center;font-size:.8rem}
.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.grid .c.on img{border-color:var(--gold)}
.evil{filter:sepia(.4) saturate(1.6) hue-rotate(-25deg) contrast(1.15) brightness(.8)}
.flip{animation:flip 1.2s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
a.btn{text-decoration:none;display:block;text-align:center}
.tile.locked img{filter:grayscale(1) brightness(.55)}
/* not owned (Márk 2026-10-23): black-and-white, a red strike line, "Nincs hozzáférésed", buy / details open the shop in a new window */
.tw{display:flex;flex-direction:column;gap:8px}
.tile.locked:after{content:"";position:absolute;left:-12%;right:-12%;top:50%;height:4px;background:#d8352e;transform:rotate(-38deg);box-shadow:0 0 12px #d8352e99;pointer-events:none}
.tile .noacc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:6px;background:#120f15e6;border:1px solid #d8352e;color:#f1d9d6;font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}
.lbtns{display:flex;flex-direction:column;gap:6px}
/* one button under every cover (Márk 2026-10-24): owned = Játék indítása, free = Ingyen kipróbálom, rest = the subtle Részletek */
.lbtns .btn{margin:0;padding:10px 8px;font-size:.88rem;width:100%}
.lbtns .lb-main{background:#b8221d;color:#fff}
.tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--line);box-shadow:0 6px 18px #0008}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.tile:active img{transform:scale(1.05)}
.tile .tt{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 9px;background:linear-gradient(transparent,#000d);font-size:.92rem;line-height:1.25}
.tile .tt .badge{margin-left:6px}
.cover{position:fixed;inset:0;z-index:30;background:#0d0b10;animation:zoomin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomin{from{transform:scale(.3);opacity:.2;border-radius:30px}to{transform:scale(1);opacity:1;border-radius:0}}
.cover .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55)}
.cover .cin{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.cover .ctext{flex:1;overflow:auto;background:#000000a8;border:1px solid #ffffff22;border-radius:16px;padding:16px;margin-bottom:12px;animation:fadein 1.2s .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* setup: crossfade into the crime scene, two half-dials (time / players) joined by a band with the start button */
.cover .bg2{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.18);filter:brightness(.5) saturate(.9);transition:opacity 1.4s ease,transform 2.6s cubic-bezier(.2,.8,.2,1)}
.cover.setup .bg{transform:scale(1.12);opacity:.0;transition:opacity 1.4s ease,transform 1.6s ease}
.cover.setup .bg2{opacity:1;transform:scale(1)}
.cover .ctext,.cover .cbot{transition:opacity .5s ease,transform .5s ease}
.cover .cstart{display:none;margin:16px 0 2px;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
.cover .cstart.show{display:block;animation:cstartin .6s ease forwards}
@keyframes cstartin{to{opacity:1;transform:none}}
.cover.setup .ctext,.cover.setup .cbot{animation:none;opacity:0;transform:translateY(-14px);pointer-events:none}
.cover.setup .cin{pointer-events:none} .cover.setup .cin button{pointer-events:auto}
.setup-st{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.setup-st .dial{position:absolute;border-radius:50%;background:radial-gradient(circle,#0000 58%,#1a1520e6 59%,#0f0c12f0 100%);box-shadow:0 0 0 1px #d9b46a55,0 0 40px #000c inset,0 0 30px #0009;opacity:0;transition:opacity .8s ease .9s,transform .9s cubic-bezier(.2,.8,.2,1) .9s}
.setup-st .dial.l{transform:translateX(-60px)} .setup-st .dial.r{transform:translateX(60px)}
.setup-st.in .dial{opacity:1;transform:none}
.setup-st .dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.setup-st .val{position:absolute;transform:translate(-50%,-50%);text-align:center;font:700 1.15rem 'Playfair Display',serif;color:var(--muted);opacity:0;transition:opacity .6s 1.2s,color .2s,font-size .2s;pointer-events:auto;cursor:pointer;line-height:1}
.setup-st.in .val{opacity:.55} .setup-st.in .val.on{opacity:1;color:var(--gold2);font-size:2.05rem;text-shadow:0 0 18px #d9b46a88}
.setup-st .val small{display:block;font:500 .62rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-top:3px;color:var(--muted)}
.setup-st .val.on small{color:var(--gold)}
.setup-st .cap{position:absolute;transform:translateX(-50%);font:600 .72rem Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .6s 1.3s}
.setup-st.in .cap{opacity:.9}
.setup-st .band{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,#d9b46a00,#d9b46acc 18%,#f0d79c 50%,#d9b46acc 82%,#d9b46a00);box-shadow:0 0 14px #d9b46a99;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1) 1.4s}
.setup-st.in .band{transform:scaleX(1)}
.setup-st .go{position:absolute;transform:translate(-50%,-50%) scale(.6);width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;opacity:0;
  background:radial-gradient(circle at 50% 35%,#f0d79c,#d9b46a 55%,#9c7a3a);color:#1a1410;font:700 1rem/1.2 'Playfair Display',serif;box-shadow:0 0 0 6px #0d0b10,0 0 0 7px #d9b46a88,0 0 40px #d9b46a77;transition:opacity .6s 1.7s,transform .6s cubic-bezier(.3,1.6,.5,1) 1.7s}
.setup-st.in .go{opacity:1;transform:translate(-50%,-50%) scale(1);animation:gopulse 2.4s 2.4s ease-in-out infinite}
.setup-st .go:active{transform:translate(-50%,-50%) scale(.94)}
@keyframes gopulse{50%{box-shadow:0 0 0 6px #0d0b10,0 0 0 7px #d9b46acc,0 0 60px #d9b46aaa}}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tg .langsel{width:auto;flex:0 0 auto;padding:8px 10px;font-size:.95rem}
.tg input{width:46px;height:26px;accent-color:var(--gold);flex:0 0 auto}
.storytxt{font-size:1.05rem;line-height:1.6;cursor:pointer}
.storytxt .key{color:var(--gold2);text-decoration:underline;text-underline-offset:3px}

"use strict";
/* ===================== constants ===================== */
const TIP = 30;                     // seconds a private tip stays on screen, clock paused

/* ===================== shop API: story texts only for the logged-in owner or a host's 24 h token ===================== */

async function apiStory(id, t) {

  const r = await fetch(`${API}/story/${id}` + (t ? `?t=${encodeURIComponent(t)}` : ""), {credentials: "include"});
  if (!r.ok) { const e = new Error("locked"); e.status = r.status; throw e; }

}

  try { const r = await fetch(`${API}/library`, {credentials: "include"}); if (r.ok) LIB = await r.json(); } catch (e) {}

}
const STORE = "et3-";

/* ===================== helpers ===================== */

  const fallback = opts.evil ? `assets/${story.id}/K${slot + 1}.jpg` : placeholder(c.name, false);
  return `<img src="${src}" alt="${esc(c.name)}" class="${opts.cls || ""}${opts.evil ? " evilf" : ""}" ` +
    `onerror="if(this.dataset.f){this.onerror=null;this.src='${placeholder(c.name, !!opts.evil)}'}else{this.dataset.f=1;this.src='${fallback}';${opts.evil ? "this.classList.add('evil');" : ""}}">`;

  knife: `<path d="M14.6 3.4c2.6.1 5.9 2.6 6 5.2L10.8 18.4l-4.2-4.2z"/><path d="M5.2 12.6l6.2 6.2"/><path d="M6.6 16.8l-3 3a1.4 1.4 0 0 0 2 2l3-3"/>`,
  hands: `<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.9-3.9a3 3 0 0 0-4.2 0l-.9.9a1 1 0 1 1-3-3l2.8-2.8a5.8 5.8 0 0 1 7.1-.9l.5.3a2 2 0 0 0 1.4.3L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>`,
};
const icon = (k, cls = "", sz) => `<svg class="ic ${cls}" ${sz ? `width="${sz}" height="${sz}"` : ""} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* ===================== card link encoding ===================== */
const KEY = "ejfeli-tanu-1462";
function b64u(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; const s = atob(str); return Uint8Array.from(s, c => c.charCodeAt(0)); }
function encodeCard(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  const out = new Uint8Array(raw.length + 1); let sum = 0;
  raw.forEach((b, i) => { out[i] = b ^ KEY.charCodeAt(i % KEY.length); sum = (sum + b * (i + 7)) & 255; });
  out[raw.length] = sum; return b64u(out);
}
function decodeCard(str) {
  const d = unb64u(str); const raw = new Uint8Array(d.length - 1); let sum = 0;
  for (let i = 0; i < raw.length; i++) { raw[i] = d[i] ^ KEY.charCodeAt(i % KEY.length); sum = (sum + raw[i] * (i + 7)) & 255; }
  if (sum !== d[d.length - 1]) throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(raw));
}
function cardUrl(P) { return location.origin + location.pathname + "#c=" + encodeCard(P); }

/* ===================== settings (main menu, top left) ===================== */
const CFG = Object.assign({music: true, narration: true, sfx: true, lang: "hu"}, ls("cfg") || {});
const saveCFG = () => ls("cfg", CFG);
function settingsModal() {
  const inGame = !!$("#scene");
  const row = (k, title) => `<label class="tg"><b>${title}</b><input type="checkbox" data-k="${k}" ${CFG[k] ? "checked" : ""}></label>`;
  modal(`<h2>Beállítások</h2>
    ${row("music", "Zene")}${row("narration", "Narráció")}${row("sfx", "Hangjelzések")}
    <label class="tg"><b>Nyelv</b><select class="langsel"><option value="hu" selected>Magyar</option><option value="en" disabled>English (hamarosan)</option></select></label>
    ${bugLink()}
    ${inGame ? `<button class="btn ghost" id="quit" style="margin-top:18px;color:#f19a92;border-color:#f19a9255">${icon("exit", "inl")} Kilépés: feladom a játékot</button>` : ""}`);
  document.querySelectorAll("#modal [data-k]").forEach(e => e.onchange = () => {
    CFG[e.dataset.k] = e.checked; saveCFG(); if (!CFG.narration && window.speechSynthesis) speechSynthesis.cancel();
    if (e.dataset.k === "music" && $("#cover")) introMusic(CFG.music);
    if (e.dataset.k === "music" && inGame && P.p === 0) { if (!CFG.music) { stopMusic(); AU.mode = null; } else { ensureAudio(); if (AU.drone) AU.drone.gain.value = .05; startMusic(S); } }
  });
  if ($("#quit")) $("#quit").onclick = () => {
    modal(`<h2>Feladod?</h2><p>A játék a te telefonodon véget ér, és visszakerülsz a főmenübe.</p>
    <button class="btn" id="quitok" style="background:#c0392b;color:#fff">Igen, feladom</button><button class="btn ghost" onclick="closeModal()">Mégse, játszom tovább</button>`);
    $("#quitok").onclick = () => { stopMusic(); stopNarration(); location.hash = ""; location.reload(); };
  };
}

/* ===================== audio (host phone only) ===================== */
const AU = {ctx: null, master: null, music: null, tension: null, nodes: [], muted: false, lastTick: -1, mode: ""};
function ensureAudio() {
  try {
    if (!AU.ctx) {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = .9; AU.master.connect(AU.ctx.destination);
    }
    if (AU.ctx.state === "suspended") AU.ctx.resume();
    if (window.speechSynthesis && !AU.warm) { AU.warm = 1; const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
  } catch (e) {}
}
function tone(freq, dur, type = "sine", vol = .2, when = 0) {
  if (!AU.ctx || AU.muted) return;
  const t = AU.ctx.currentTime + when, o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol = .2, hp = 2000, when = 0) {
  if (!AU.ctx || AU.muted) return;
  const t = AU.ctx.currentTime + when, len = Math.max(1, AU.ctx.sampleRate * dur), b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AU.ctx.createBufferSource(), f = AU.ctx.createBiquadFilter(), g = AU.ctx.createGain();
  f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(AU.master); s.start(t);
}
const tick = loud => { if (!CFG.sfx) return; noise(.03, .25 + loud * .5, 3500); tone(1800, .03, "square", .04 + loud * .08); };
const chime = () => { if (!CFG.sfx) return; tone(880, .9, "sine", .16); tone(1320, 1.1, "sine", .1, .12); };
const drumroll = sec => { if (!CFG.sfx) return; for (let i = 0; i < sec * 18; i++) noise(.05, .12 + i / (sec * 18) * .25, 300, i / 18); tone(110, 1.2, "triangle", .35, sec); };
// Placeholder music: a story file assets/<id>/music.mp3 (and tension.mp3) wins when it exists, else a generated drone.
function startMusic(story) {
  if (AU.mode || !CFG.music) return; AU.mode = "calm";
  // music runs through the whole game (Márk 2026-10-18): take over the intro track if it is still playing
  if (IMUS.a) { AU.music = IMUS.a; IMUS.a = null; return; }
  const play = (src, fail) => { const a = new Audio(src); a.loop = true; a.volume = .3; a.play().then(() => { AU.music = a; }).catch(fail); };
  play(`assets/${story.id}/music.mp3`, () => play("assets/music_intro.mp3", () => drone()));
}
function drone() {
  if (!AU.ctx) return;
  const g = AU.ctx.createGain(); g.gain.value = .05; const lp = AU.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
  [55, 55.4, 82.4].forEach(f => { const o = AU.ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(); AU.nodes.push(o); });
  const lfo = AU.ctx.createOscillator(), lg = AU.ctx.createGain(); lfo.frequency.value = .08; lg.gain.value = 250; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(g); g.connect(AU.master); AU.drone = g;
}
function tensionOn(story) {
  if (AU.mode === "tension" || !CFG.music) return; AU.mode = "tension";
  const a = new Audio(`assets/${story.id}/tension.mp3`); a.loop = true; a.volume = .5;
  a.play().then(() => { if (AU.music) AU.music.pause(); AU.tension = a; }).catch(() => {
    if (AU.drone) AU.drone.gain.value = .08;
    AU.pulse = setInterval(() => { tone(55, .35, "sine", .5); tone(110, .12, "triangle", .12); }, 750);
  });
}
function stopMusic() {
  [AU.music, AU.tension].forEach(a => a && a.pause()); clearInterval(AU.pulse);
  AU.nodes.forEach(o => { try { o.stop(); } catch (e) {} }); AU.nodes = []; if (AU.drone) AU.drone.gain.value = 0; AU.mode = "done";
}
/* ---------- narration: typewriter text + voice + scream at the murder (Márk 2026-10-18) ---------- */
// story text markup: **key fact** = bold+underline, [SIKOLY] = scream moment
function storyParts(story) {
  const raw = story.story || story.intro;
  return raw.split("[SIKOLY]").map(p => {
    const tok = []; p.split(/(\*\*[^*]+\*\*)/).forEach(t => { if (!t) return; const b = t.startsWith("**"); tok.push({t: b ? t.slice(2, -2) : t, b}); });
    return tok;
  });
}
const plainOf = tok => tok.map(x => x.t).join("");
function tokHTML(tok, k) {
  let h = "", n = 0;
  for (const x of tok) { if (n >= k) break; const s = x.t.slice(0, k - n); n += s.length; h += x.b ? `<b class="key">${esc(s)}</b>` : esc(s); }
  return h;
}
const NARR = {gen: 0};
// iOS only lets an audio element play later from a timer if it was started once inside a tap: unlock the scream on the tap that opens the story
const SCREAM = {a: null};
function silentWav() {   // 0.05 s of silence, 8 kHz 8-bit mono
  const n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true); b.fill(128, 44);
  return "data:audio/wav;base64," + btoa(String.fromCharCode(...b));
}
function unlockScream() {
  if (SCREAM.a) return;
  const a = new Audio(silentWav()); SCREAM.a = a;
  const swap = () => { a.pause(); a.src = "assets/sfx_scream.mp3"; a.preload = "auto"; a.load(); };
  a.play().then(swap).catch(swap);
}
// Chrome processes cancel() asynchronously: an utterance queued right after it can be killed too ("interrupted"),
// which looked like "narration on, but silent" (Márk 2026-10-23). So cancel only when something is queued,
// speak a moment later, in sentence-sized chunks (Chrome also stalls on long utterances), and retry once.
function stopNarration() { NARR.gen++; const ss = window.speechSynthesis; if (ss && (ss.speaking || ss.pending)) { ss.cancel(); NARR.cut = Date.now(); } if (NARR.audio) NARR.audio.pause(); }
function huVoice() { return (window.speechSynthesis ? speechSynthesis.getVoices() : []).find(v => /^hu/i.test(v.lang)); }
function voicesReady() {
  if (!window.speechSynthesis || speechSynthesis.getVoices().length) return Promise.resolve();
  return new Promise(r => { const t = setTimeout(r, 1200); speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); r(); }, {once: true}); });
}
function chunksOf(text) {

function loop() {
  const t = TL();
  let key = t.ph === "wait" ? "wait" : t.ph === "intro" ? "read" + Math.min(ST.userStep, 3) : t.ph === "end" ? "end" : "scene";
  if (t.ph === "tip") key += "tip" + t.i;
  if (key !== ST.key) { ST.key = key; render(t); }
  update(t);
}
function render(t) {
  closeModal();
  if (t.ph === "wait") return waitView();
  if (t.ph === "intro") return readView(ST.userStep);
  if (t.ph === "end") return ls("vote-" + P.t0) ? voteFlow() : endView();
  sceneView(t);
  if (t.ph === "tip") tipView(t.i);
}
function update(t) {
  if (t.ph === "end") { if (ls("vote-" + P.t0)) return; return voteTick(); }
  if (t.ph === "intro") { const b = $("#ibar"); if (b) { b.style.width = (100 * t.left / INTRO) + "%"; b.parentNode.classList.toggle("low", t.left <= 10); } }
  if (t.ph === "play" || t.ph === "tip") {
    const D = P.m * 60, rem = t.rem;
    drawClock(rem / D, t.ph === "tip", t.ph === "play" && rem <= 60, rem);
    if (P.p === 0 && t.ph === "play") {
      if (rem <= 180) tensionOn(S);
      if (rem <= 60) { const s = Math.ceil(rem * (rem <= 10 ? 2 : 1)); if (s !== AU.lastTick) { AU.lastTick = s; tick(1 - rem / 60); } }
    }
  }
  if (t.ph === "tip") { const b = $("#tbar"); if (b) { b.style.width = (100 * t.left / TIP) + "%"; b.parentNode.classList.toggle("low", t.left <= 10); } }
}
function waitView() {
  app.innerHTML = `<div class="center" style="padding-top:12vh"><h1>${esc(S.title)}</h1>
    <div class="panel"><p>Várjuk, hogy mindenki beolvassa a kódját.</p><p class="small muted">Amikor a játékvezető elindítja, minden telefonon egyszerre jön a saját karaktered, utána közösen indul az óra.</p></div>
    <button class="btn ghost" id="manual" style="display:none">Nem indul? Indítás kézzel</button></div>`;
  setTimeout(() => { const b = $("#manual"); if (b) b.style.display = "block"; }, 20000);
  $("#manual").onclick = () => { ST.start = Date.now(); saveST(); ST.key = ""; loop(); };
}

/* ---------- own introduction in 3 steps: 1 minute for everyone, then the clock starts together ---------- */

}
function myRole() {

}
// order requested by Márk, unnumbered: public -> appearance -> where -> victim -> observations (incl. the 30 s observations received)
function myCard(skipPublic) {

    <div class="kv"><b>A kapcsolatod az áldozattal</b>${ME.rel ? esc(ME.rel) + " " : ""}<span class="muted">A titkos okod:</span> ${esc(ME.motive)}</div>

function readView(step) {

  } else if (step === 1) {
    h += `<h2>Te és ${esc(S.victim.split(",")[0])}</h2>${myCard()}
      <p class="small muted">A játék alatt időnként eszedbe jut valami: 30 másodperced van kiválasztani, melyiket mondod el, utána az nyilvános lesz, mindenki látja a karaktered lapján. A lapodat a játék alatt is megnézheted: koppints a saját képedre.</p>`;

/* ---------- suspicion slider next to each portrait (Márk 2026-10-18), own icon set ---------- */
// Márk 2026-10-18: one slider per portrait, top to bottom: innocent (green hand), witness (blue eye), unknown (grey ?),
// accomplice (orange handshake, only when one is in play), murderer (red knife). Own portrait: just your role.
// A tray at the bottom shows every role in play; each mark you hand out (and your own role) greys one out.
const MARK = {N: {col: "#4caf7a", ic: "ok"}, S: {col: "#5b9bd5", ic: "eye"}, Q: {col: "#8a8590", ic: "q"}, B: {col: "#e8913a", ic: "hands"}, G: {col: "#d2554d", ic: "knife"}};
const roleOfSlot = sl => S.chars[sl].role;
// only the roles that are in play this game: no witness at 4-5 players, no accomplice at 4
const susOrder = () => ["N", "S", "Q", "B", "G"].filter(k => k === "Q" || P.ch.some(sl => roleOfSlot(sl) === k));
function notesKey() { return "notes-" + P.t0 + "-" + P.p; }
function susOf(slot) { const v = ((ls(notesKey()) || {}).sus || {})[slot]; return susOrder().includes(v) ? v : "Q"; }
function setSus(slot, k) {
  const N = ls(notesKey()) || {text: "", sus: {}}; N.sus = N.sus || {};
  N.sus[slot] = k; ls(notesKey(), N);
  const el = document.querySelector(`[data-mk="${slot}"]`); if (el) el.outerHTML = markHTML(slot);
  document.querySelectorAll("#modal [data-sus]").forEach(b => b.classList.toggle("on", b.dataset.sus === k));
  drawTray();
}
const SUSLAB = {N: "Ártatlan", S: "Szemtanú", Q: "Nem tudom", B: "Bűntárs", G: "Gyilkos"};
// small icon by the name on the scene: your verdict on them, or your own role
// keeps the icon on the same line as the last word of the name
function nameWithMark(name, mk) { const w = name.split(" "), last = w.pop(); return (w.length ? esc(w.join(" ")) + " " : "") + `<em class="nw">${esc(last)}${mk}</em>`; }
function markHTML(slot) { const m = MARK[susOf(slot)]; return `<i class="mk" data-mk="${slot}" style="--c:${m.col}">${icon(m.ic)}</i>`; }
// verdict picker at the bottom of another player's popup (Márk 2026-10-18: easier than the slider on the scene)
function susPicker(slot) {
  const cur = susOf(slot);
  return `<div class="suspick"><b>Szerinted ő:</b><div class="opts">${susOrder().map(k => `<button data-sus="${k}" class="${k === cur ? "on" : ""}" style="--c:${MARK[k].col}"><i>${icon(MARK[k].ic)}</i><span>${SUSLAB[k]}</span></button>`).join("")}</div></div>`;
}
function drawTray() {
  const t = $("#tray"); if (!t) return;
  const used = {N: 0, S: 0, B: 0, G: 0};  // your own role is not greyed out: that would show it to anyone looking
  P.ch.forEach((sl, i) => { if (i !== P.p) { const k = susOf(sl); if (k in used) used[k]++; } });
  let h = "";
  ["N", "S", "B", "G"].forEach(k => { const total = P.ch.filter(sl => roleOfSlot(sl) === k).length;
    for (let i = 0; i < total; i++) h += `<span class="tk ${i < used[k] ? "used" : ""}" style="--c:${MARK[k].col}">${icon(MARK[k].ic)}</span>`; });
  t.innerHTML = h;
}

/* ---------- crime scene with clock, map, notebook ---------- */
// per-story clock skin (Márk 2026-10-18): face, ring, accent and a small ornament that fits the world
// orn: studs = rivets on the ring, spokes = ship-wheel handles, spikes = gothic points, stars = little stars
const CLOCK_THEME = {
  S01: {face: "#efe2c4", ring: "#b8902f", ring2: "#6e5418", ink: "#2b2014", wedge: "#a3282a", orn: "studs", n: 4},
  S02: {face: "#eadfc8", ring: "#9c7a43", ring2: "#4a3720", ink: "#2a2018", wedge: "#7a1f1f", orn: "studs", n: 12},
  S03: {face: "#ddd6d0", ring: "#3a3036", ring2: "#a9a9b3", ink: "#1c1418", wedge: "#8b0000", orn: "spikes", n: 12},
  S04: {face: "#ece4f6", ring: "#3d2b6b", ring2: "#d9b46a", ink: "#24183f", wedge: "#7a3fb8", orn: "stars", n: 8},
  S05: {face: "#e8d9b5", ring: "#6b4423", ring2: "#c9a64b", ink: "#2b1c0e", wedge: "#9b2d20", orn: "spokes", n: 8},
  S06: {face: "#f3efe6", ring: "#1d3557", ring2: "#c9a64b", ink: "#14213d", wedge: "#b5332e", orn: "studs", n: 12},
  S07: {face: "#f4efe3", ring: "#c9a64b", ring2: "#7a5a1e", ink: "#2b2418", wedge: "#9b3a24", orn: "stars", n: 12},
  S08: {face: "#f2f4f7", ring: "#2b2f36", ring2: "#9aa3ad", ink: "#1b1f24", wedge: "#c0392b", orn: "studs", n: 4},
  S09: {face: "#ece6da", ring: "#2f4f3a", ring2: "#8b1e2d", ink: "#1e2a21", wedge: "#8b1e2d", orn: "studs", n: 8},
  S10: {face: "#0f1b2b", ring: "#1f6f8b", ring2: "#5bc0eb", ink: "#d8f3ff", wedge: "#e94f37", orn: "spikes", n: 4}};
function clockOrnament(T) {
  let h = "";
  for (let i = 0; i < T.n; i++) {
    const a = i * 2 * Math.PI / T.n, sx = Math.sin(a), cy = -Math.cos(a), at = (r) => `${(50 + r * sx).toFixed(2)} ${(50 + r * cy).toFixed(2)}`;
    if (T.orn === "studs") h += `<circle cx="${50 + 49.5 * sx}" cy="${50 + 49.5 * cy}" r="1.6" fill="${T.ring2}"/>`;
    else if (T.orn === "spokes") h += `<line x1="${50 + 52 * sx}" y1="${50 + 52 * cy}" x2="${50 + 58 * sx}" y2="${50 + 58 * cy}" stroke="${T.ring}" stroke-width="3.2" stroke-linecap="round"/><circle cx="${50 + 58 * sx}" cy="${50 + 58 * cy}" r="2.2" fill="${T.ring2}"/>`;
    else if (T.orn === "spikes") { const b = .09; h += `<path d="M${at(57)} L${(50 + 52 * Math.sin(a - b)).toFixed(2)} ${(50 - 52 * Math.cos(a - b)).toFixed(2)} L${(50 + 52 * Math.sin(a + b)).toFixed(2)} ${(50 - 52 * Math.cos(a + b)).toFixed(2)} Z" fill="${T.ring2}"/>`; }
    else if (T.orn === "stars") { const c = [50 + 49.5 * sx, 50 + 49.5 * cy]; let d = ""; for (let k = 0; k < 10; k++) { const r = k % 2 ? .9 : 2.2, q = k * Math.PI / 5; d += `${k ? "L" : "M"}${(c[0] + r * Math.sin(q)).toFixed(2)} ${(c[1] - r * Math.cos(q)).toFixed(2)}`; } h += `<path d="${d}Z" fill="${T.ring2}"/>`; }
  }
  return h;
}
function drawClock(frac, paused, urgent, rem) {
  const el = $("#clock"); if (!el) return;
  const T = CLOCK_THEME[S && S.id] || CLOCK_THEME.S01;
  el.setAttribute("viewBox", "-9 -9 118 118");
  frac = Math.max(0, Math.min(1, frac));
  const a = frac * 2 * Math.PI, r = 44, x = 50 + r * Math.sin(a), y = 50 - r * Math.cos(a);
  const wedge = frac >= .999 ? `<circle cx="50" cy="50" r="${r}" fill="${T.wedge}"/>` : frac <= 0 ? "" :
    `<path d="M50 50 L50 ${50 - r} A${r} ${r} 0 ${a > Math.PI ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="${T.wedge}" fill-opacity=".9"/>`;
  let ticks = ""; for (let i = 0; i < 60; i++) { const b = i * 6 * Math.PI / 180, l = i % 5 ? 3 : 7; ticks += `<line x1="${50 + 45 * Math.sin(b)}" y1="${50 - 45 * Math.cos(b)}" x2="${50 + (45 - l) * Math.sin(b)}" y2="${50 - (45 - l) * Math.cos(b)}" stroke="${T.ink}" stroke-width="${i % 5 ? .6 : 1.4}"/>`; }
  // digital readout either side of the pivot (the pivot reads as the colon)
  let dig = "";
  if (rem !== undefined) { const t = Math.max(0, Math.ceil(rem)), mm = String(Math.floor(t / 60)).padStart(2, "0"), ss = String(t % 60).padStart(2, "0");
    const txt = (xx, anchor, v) => `<text x="${xx}" y="51" text-anchor="${anchor}" dominant-baseline="middle" font-family="Inter,sans-serif" font-weight="800" font-size="17" fill="${T.ink}" stroke="${T.face}" stroke-width="3" paint-order="stroke">${v}</text>`;
    dig = txt(44, "end", mm) + txt(56, "start", ss); }
  // spokes and spikes stick out behind the ring, studs and stars sit on it
  const orn = clockOrnament(T), out = T.orn === "spokes" || T.orn === "spikes";
  el.innerHTML = `${out ? orn : ""}<circle cx="50" cy="50" r="52" fill="${T.ring}"/><circle cx="50" cy="50" r="49.5" fill="none" stroke="${T.ring2}" stroke-width="1.2"/>${out ? "" : orn}
    <circle cx="50" cy="50" r="47" fill="${T.face}"/>${wedge}${ticks}${dig}
    <line x1="50" y1="50" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="${T.ink}" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="${T.ink}"/>${paused ? `<rect x="42" y="66" width="5" height="12" fill="${T.ink}"/><rect x="53" y="66" width="5" height="12" fill="${T.ink}"/>` : ""}`;
  el.classList.toggle("urgent", !!urgent); el.classList.toggle("paused", !!paused);
}
function sceneView(t) {
  const n = P.n.length, slots = P.ch;
  let h = `<div id="scene"><div class="bg" id="bg"></div>
    <div class="hud"><div class="hright"><button class="hbtn" id="setb" title="Beállítások">${icon("gear")}</button></div><svg id="clock" viewBox="0 0 100 100"></svg>
    <div class="hright"><button class="hbtn" id="mapb" title="Térkép">${icon("map")}</button></div></div>
    <div class="stage"><div class="victim"><div class="vb">${icon("cross")}</div><span class="vn">${esc(S.victim.split(",")[0])}</span></div>
    <button class="helpq" id="storyb" title="A történet">${icon("q")}</button>`;
  const trayHTML = `<div class="tray" id="tray"></div>`;
  // you sit at the bottom centre with no mark at all (a friend glancing at your screen must not see your role);
  // the others go round the table, keeping the same seating order (Márk 2026-10-18)
  slots.forEach((slot, i) => {
    const k = (i - P.p + n) % n, ang = Math.PI / 2 + k * 2 * Math.PI / n;
    const c = Math.cos(ang), x = 50 + 38 * Math.sign(c) * Math.sqrt(Math.abs(c)), y = 50 + 39 * Math.sin(ang); // pushed out towards the screen edges
    h += `<div class="ch ${i === P.p ? "me" : ""}" data-slot="${slot}" style="left:${x}%;top:${y}%"><div class="avw"><div class="av">${pimg(S, slot)}</div></div><span>${i === P.p ? esc(S.chars[slot].name) : nameWithMark(S.chars[slot].name, markHTML(slot))}</span></div>`;
  });
  h += `</div>${trayHTML}</div>`;
  app.innerHTML = h; drawTray();
  const bg = new Image(); bg.onload = () => { $("#bg").style.backgroundImage = `url(${bg.src})`; $(".victim").classList.add("img"); }; bg.onerror = () => $("#bg").classList.add("none"); bg.src = `assets/${S.id}/scene.jpg`;
  app.querySelectorAll(".ch").forEach(e => e.onclick = () => charModal(+e.dataset.slot));
  $("#mapb").onclick = mapModal; $("#storyb").onclick = storyModal; $("#setb").onclick = settingsModal;
  if (P.p === 0) { ensureAudio(); startMusic(S); }
}

function closeModal() { const m = $("#modal"); if (m) { if (m.querySelector("#mtyped")) stopNarration(); m.remove(); } }
function zoomable(html) { return `<div class="zoomwrap" onclick="this.classList.toggle('z')">${html}</div><p class="small muted center">Koppints a nagyításhoz.</p>`; }

// zoomed: open straight in the zoomed-in view (magnifier button, Márk 2026-10-18); a blinking 4-way arrow shows the image can be dragged
function photoView(story, slot, html, caption, zoomed) {
  const v = document.createElement("div"); v.className = "photo"; v.id = "photo";
  v.innerHTML = `<button class="hbtn" id="phx" style="position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:4">${icon("close")}</button>
    <div class="pwrap" id="pwrap">${html || pimg(story, slot, {cls: "pimg"})}</div>${caption ? `<div class="pcap">${caption}</div>` : ""}<p class="phint">Csippents vagy koppints a nagyításhoz</p>`;
  document.body.appendChild(v);
  const w = $("#pwrap"), img = w.querySelector("img");
  const hint = () => { const o = v.querySelector(".movehint"); if (o) o.remove(); const h = document.createElement("div"); h.className = "movehint"; h.innerHTML = icon("move"); v.appendChild(h); };
  // fx, fy: point of the image (0-1) to bring to the middle of the screen
  const ph = v.querySelector(".phint"), setHint = z => ph.textContent = z ? "Húzd a képet a mozgatáshoz, koppints a kicsinyítéshez" : "Csippents vagy koppints a nagyításhoz";
  const zoomTo = (fx, fy) => { w.classList.add("z"); setHint(true); requestAnimationFrame(() => { w.scrollLeft = w.scrollWidth * fx - w.clientWidth / 2; w.scrollTop = w.scrollHeight * fy - w.clientHeight / 2; }); hint(); };
  w.onclick = e => {
    if (w.classList.contains("z")) { w.classList.remove("z"); setHint(false); return; }
    const r = (img || w).getBoundingClientRect(); zoomTo(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)));
  };
  if (zoomed) { const go = () => zoomTo(.5, .35); if (img && !img.complete) img.addEventListener("load", go, {once: true}); else go(); }
  $("#phx").onclick = () => v.remove();
}

/* ---------- 30 s "eszembe jutott", then public ---------- */
// Márk 2026-10-22: everybody chooses. The murderer picks from 3 lies, the accomplice from 2 lies, every innocent
// (the witness too) from 2 true memories. Lies are a bit vaguer, truths a bit more concrete, so read aloud they sound alike.
// Lies never name somebody out of play or the liar himself; each shows whom it steers suspicion to.
// After the 30 s the chosen line goes onto that character's public sheet on every phone (unmarked).
const isLiar = slot => S.chars[slot].role === "G" || S.chars[slot].role === "B";
function optsFor(slot, i) {
  const t = S.tips[ROUND[i]][slot];
  if (!Array.isArray(t)) return [{t, to: []}];
  if (typeof t[0] === "string") return t.map(x => ({t: x, to: []}));
  // the murderer and the accomplice know each other (Márk 2026-10-22), so neither lie points at the evil side
  return t.filter(x => x.r.every(r => P.ch.includes(r)) && !x.to.some(isLiar)).slice(0, S.chars[slot].role === "B" ? 2 : 3);
}
function chosenOpt(slot, i) {
  const j = P.ch.indexOf(slot); let k = 0;
  if (slot === SLOT) { const o = ST.obs.find(o => o.n === i + 1); if (o && o.k !== undefined) k = o.k; }
  else SYNC.msgs.forEach(x => { const l = x.m.l; if (l && l.p === j && l.n === i) k = l.k; });   // the last choice counts
  return k;
}
function accExtra(slot, i) {
  const last = i === TIPS_AT[P.m].length - 1;
  return last && P.ch.length >= 5 && S.accTo === slot && !isLiar(slot) ? S.accTip : "";
}
function obsText(slot, i) {
  const o = optsFor(slot, i), a = accExtra(slot, i);
  return (o[chosenOpt(slot, i)] || o[0]).t + (a ? " " + a : "");
}
// how many rounds are over (their 30 s ended)
function tipsDone() {
  if (!ST.start) return 0;
  const e = (NOW() - ST.start) / 1000 * P.x - INTRO, D = P.m * 60, T = TIPS_AT[P.m];
  return T.filter((r, i) => e >= (D - r) + TIP * i + TIP).length;
}
function publicObs(slot) {
  const n = tipsDone(); if (!n) return "";
  return `<div class="kv"><b>Ami eszébe jutott</b>${[...Array(n).keys()].map(i => `<p style="margin:4px 0">„${esc(obsText(slot, i))}”</p>`).join("")}</div>`;
}
function tipView(i) {
  const opts = optsFor(SLOT, i), liar = isLiar(SLOT), extra = accExtra(SLOT, i);
  if (!ST.tipSeen[i]) {
    ST.tipSeen[i] = 1;
    ST.obs.push({n: i + 1, k: 0, liar, text: opts[0].t + (extra ? " " + extra : "")});
    saveST(); ensureAudio(); chime(); if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
    syncPost({l: {p: P.p, n: i, k: 0}});
  }
  const cur = chosenOpt(SLOT, i);
  const intro = liar
    ? `Neked nincs valódi emléked. Válassz egy hazugságot: 30 másodperc múlva ez kerül ki mindenkinek a lapodra, mintha valóban így lett volna. Alatta látod, kire tereli a gyanút.`
    : opts.length > 1 ? `Két dolog jutott eszedbe, mindkettő igaz. Ha emlékszel rájuk, mindkettőt elmondhatod a többieknek, de a lapodra csak az egyik kerül ki: válaszd ki, melyik legyen. 30 másodperc múlva mindenki látja.` : "";
  const body = `${intro ? `<p>${intro}</p>` : ""}<div class="lies">${opts.map((x, k) =>
      `<button class="lie ${k === cur ? "on" : ""}" data-k="${k}"><span>„${esc(x.t)}”</span>${liar ? `<small>Gyanú: ${x.to.map(t => esc(S.chars[t].name)).join(", ")}</small>` : ""}</button>`).join("")}</div>` +
    (extra ? `<p class="small">És ezt is hozzáteszed: „${esc(extra)}”</p>` : "");
  const m = modal(`<h2>${icon("eye", "inl")} Eszembe jutott...</h2>${body}<div class="bar" style="margin-top:12px"><i id="tbar"></i></div><p class="small muted">Az óra áll. 30 másodperc múlva a választott mondat nyilvános lesz: mindenki látja a karaktered lapján. Gondold végig, mit jelent!</p>`, "tipbox");
  m.querySelector(".x").remove(); m.onclick = null;
  m.querySelectorAll(".lie").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, o = ST.obs.find(o => o.n === i + 1); if (o) { o.k = k; o.text = opts[k].t + (extra ? " " + extra : ""); } saveST();
    syncPost({l: {p: P.p, n: i, k}});
    m.querySelectorAll(".lie").forEach(x => x.classList.toggle("on", x === b)); tone(520, .1);
  });
}

/* ---------- end: everyone votes on their own phone (Márk 2026-10-18) ----------
   Votes go through the game's ntfy topic. Every phone replays the same message log with the same rules,
   so all of them reach the same verdict. 30 s per round; whoever has not voted by then abstains. */
const VOTE_S = 30, TALK_S = 180, REVEAL = 3300;
const VOTE = {sel: {}, mine: {}, drum: {}, key: ""};
function gameEndAt() { return ST.start + (INTRO + P.m * 60 + TIP * TIPS_AT[P.m].length) / P.x * 1000; }
function seedPick(arr, salt) { let h = 7; for (const c of String(P.g || P.t0) + salt) h = (h * 31 + c.charCodeAt(0)) >>> 0; return arr[h % arr.length]; }
function voteState(now) {
  const n = P.ch.length, roleOf = i => S.chars[P.ch[i]].role, dropRole = P.ch.some(sl => S.chars[sl].role === "B") ? "B" : "G";
  let r = 1, start = gameEndAt(), kind = "main", cands = null, outB;  // outB: kept for old saved games, never set now
  for (;;) {
    const dl = start + VOTE_S * 1000 / P.x, pool = [...Array(n).keys()].filter(j => j !== outB && (!cands || cands.includes(j)));
    const st = {r, start, dl, kind, pool, outB, n};
    const votes = {}; let last = 0;
    SYNC.msgs.forEach(x => { const v = x.m.v; if (v && v.r === r && x.t <= dl + 999 && pool.includes(v.j) && v.p !== v.j && v.p >= 0 && v.p < n) { votes[v.p] = v.j; last = Math.max(last, x.t); } });
    st.votes = votes;
    const done = Object.keys(votes).length >= n;
    if (!done && now < dl + 2500) { st.phase = "vote"; return st; }   // a little grace for votes still in flight
    st.resolve = done ? Math.min(last, dl) : dl + 2500;
    const count = skip => { const t = Array(n).fill(0); Object.entries(votes).forEach(([v, j]) => { if (!(skip && roleOf(+v) === dropRole)) t[j]++; }); return t; };
    let tally = count(false), max = Math.max(...pool.map(j => tally[j])), top = pool.filter(j => tally[j] === max), next;
    if (top.length > 1 && kind !== "tie") { st.tie = top; next = {kind: "tie", cands: top}; }
    else {
      if (top.length > 1) {   // second tie: the evil vote that only steers is dropped, then lots
        st.dropped = dropRole; tally = count(true); max = Math.max(...pool.map(j => tally[j])); top = pool.filter(j => tally[j] === max);
        if (top.length > 1) { st.lot = 1; top = [seedPick(top, "r" + r)]; }
      }
      st.j = top[0]; st.role = roleOf(st.j); st.max = max;
      st.tally = tally; st.phase = "verdict"; return st;
    }
    st.tally = tally;
    // 3 minutes of arguing before the next round; anyone can cut it short
    let ns = st.resolve + (REVEAL + TALK_S * 1000) / P.x;
    SYNC.msgs.forEach(x => { if (x.m.s && x.m.s.r === r && x.t >= st.resolve) ns = Math.min(ns, Math.max(x.t, st.resolve + REVEAL)); });
    st.next = ns;
    if (now < ns) { st.phase = "between"; return st; }
    r++; start = ns; kind = next.kind; cands = next.cands || null; if (next.outB !== undefined) outB = next.outB;
  }
}
function endView() {
  if (P.p === 0 && AU.mode !== "done") stopMusic();
  VOTE.key = ""; voteTick();
}
function voteTick() {
  if (ls("vote-" + P.t0)) return;   // the offline one-phone vote was chosen
  const now = NOW(), st = voteState(now);
  const revealing = (st.phase === "between" || st.phase === "verdict") && now < st.resolve + REVEAL / P.x;
  let guess = null;
  if (st.phase === "verdict" && st.role === "G") SYNC.msgs.forEach(x => { if (!guess && x.m.g && x.t >= st.resolve) guess = x.m.g.j; });
  const iVoted = st.votes[P.p] !== undefined || VOTE.mine[st.r] !== undefined;
  const key = [st.phase, st.r, revealing, iVoted, guess, VOTE.fin].join("|");
  if (key !== VOTE.key) { VOTE.key = key; voteRender(st, revealing, iVoted, guess); }
  // live bits: countdown bar, vote counter, discussion clock
  const left = (st.dl - now) / 1000 * P.x, b = $("#vbar");
  if (b) { b.style.width = Math.max(0, 100 * left / VOTE_S) + "%"; b.parentNode.classList.toggle("low", left <= 10); }
  const c = $("#vcount"); if (c) c.textContent = `${Object.keys(st.votes).length}/${st.n}`;
  if (st.phase === "between" && !revealing) { const rem = (st.next - now) / 1000 * P.x; drawClock(rem / TALK_S, false, rem <= 30, rem); }
}
function voteRender(st, revealing, iVoted, guess) {

    const rows = st.pool.filter(j => j !== P.p).map(j => { const sl = P.ch[j], c = S.chars[sl], k = susOf(sl), m = MARK[k];
      return `<div class="vrow ${VOTE.sel[st.r] === j ? "on" : ""}" data-j="${j}"><div class="av">${pimg(S, sl)}</div><div class="nm"><b>${esc(c.name)}</b><small>${esc(c.title)}</small></div>
        ${k !== "Q" ? `<div class="mymk" style="--c:${m.col}"><i>${icon(m.ic)}</i>${SUSLAB[k]}</div>` : ""}</div>`; }).join("");

    `<div class="vrow" data-j="${j}"><div class="av">${pimg(S, P.ch[j])}</div><div class="nm"><b>${nm(j)}</b><small>${esc(S.chars[P.ch[j]].title)}</small></div></div>`).join("") + `</div><button class="btn" id="gcast" disabled>Ő a szemtanú</button>`;

    let sel = null;
    app.innerHTML = `<h2>${esc(lab(V.i))}, ki a gyilkos?</h2><p class="small muted">A szavazatodat senki nem látja.${V.round2 ? " Második kör: csak a döntetlenben érintettek közül választhatsz." : V.outB !== undefined ? " A bűntárs már lebukott, őt nem jelölheted." : ""}</p><div class="grid">` +
      P.ch.map((sl, j) => j === V.i || j === V.outB || (V.round2 && !V.cands.includes(j)) ? "" : `<div class="c" data-j="${j}">${pimg(S, sl)}<b>${esc(S.chars[sl].name)}</b></div>`).join("") +
      `</div><button class="btn" id="cast" disabled>Leadom a szavazatom</button>`;
    app.querySelectorAll(".grid .c").forEach(e => e.onclick = () => { sel = +e.dataset.j; app.querySelectorAll(".grid .c").forEach(x => x.classList.toggle("on", x === e)); $("#cast").disabled = false; });
    $("#cast").onclick = () => { V.votes[V.i] = sel; V.stage = "pass"; save(); tone(520, .15); voteFlow(); };
  } else if (V.stage === "count") {
    app.innerHTML = `<div class="center" style="padding-top:18vh"><h1>Számolás...</h1><p class="big drumb">${icon("drum", "", 64)}</p></div>`;
    ensureAudio(); drumroll(3);
    setTimeout(() => { V.stage = "reveal"; save(); voteFlow(); }, 3300);
  } else if (V.stage === "reveal") {
    // second tie: 4-5 players drop the murderer's vote, 6 players only the accomplice's (Márk 2026-10-18)
    const hasB = P.ch.some(sl => S.chars[sl].role === "B"), hasS = P.ch.some(sl => S.chars[sl].role === "S");
    const dropRole = hasB ? "B" : "G", dropName = hasB ? "a bűntárs" : "a gyilkos";
    const count = skipEvil => { const t = Array(n).fill(0); Object.entries(V.votes).forEach(([v, j]) => { if (!(skipEvil && roleOf(+v) === dropRole)) t[j]++; }); return t; };
    let tally = count(false), max = Math.max(...tally), top = tally.map((c, j) => c === max ? j : -1).filter(j => j >= 0);
    let h = `<h1 class="center">Az ítélet</h1>`, note = "";
    if (top.length > 1 && V.round2) {
      // second tie: the evil players' votes no longer count (they only steer); if still tied, draw lots
      tally = count(true); max = Math.max(...tally); top = tally.map((c, j) => c === max ? j : -1).filter(j => j >= 0);
      note = `<div class="panel small"><b>Újra döntetlen lett.</b> Ilyenkor ${dropName} szavazata nem számít, hiszen ő úgyis csak terel. A gép kivette a szavazatát, és újraszámolt.`;
      if (top.length > 1) { if (V.lot === undefined) V.lot = top[Math.floor(Math.random() * top.length)]; note += ` Még így is döntetlen maradt, ezért sorsolás döntött.`; top = [V.lot]; }
      note += `</div>`;
      if (!V.noteShown) { V.noteShown = 1; save(); setTimeout(() => modal(`<h2>Újra döntetlen</h2>${note}<button class="btn" onclick="closeModal()">Értem, jöjjön az ítélet</button>`), 50); }
    }
    if (top.length > 1 && !V.round2) {
      h += `<p class="big">Döntetlen!</p><p class="center">${top.map(j => `<b>${esc(lab(j))}</b>`).join(" és ")} ugyanannyi szavazatot kapott.</p>
        <p class="center">Még <b>3 perc</b> érvelés, aztán új titkos szavazás, de már csak közöttük. Ebben a körben még mindenki szavazata számít.</p>
        <p class="center small muted">Ha másodszor is döntetlen lesz, ${dropName} szavazatát a gép kiveszi, így biztosan lesz ítélet.</p><button class="btn" id="extra">Indul a 3 perc</button>`;
      V.cands = top;
    } else {
      h += note;
      const j = top[0], r = roleOf(j), sl = P.ch[j], evil = r === "G" || r === "B";
      h += `<div class="center flip">${pimg(S, sl, {cls: "pfp", evil})}</div><p class="big">${esc(S.chars[sl].name)}</p><p class="center muted">${max} szavazat</p>`;
      if (r === "G" && !hasS) { h += `<p class="big" style="color:var(--red)">A GYILKOS volt!</p><p class="big" style="color:var(--green)">Az ártatlanok nyertek!</p>`; V.outcome = "good"; }
      else if (r === "G") { h += `<p class="big" style="color:var(--red)">A GYILKOS volt!</p><p class="center">Utolsó esély: ha a bűntársával összesúgva kitalálja, ki a szemtanú, mégis a gonoszok nyernek.</p><button class="btn" id="g">${esc(lab(j))}, tippelj a szemtanúra</button>`; V.conv = j; }
      else if (r === "B") { h += `<p class="big" style="color:#f0a35e">A BŰNTÁRS volt!</p><p class="center">Ő csak segített. A gyilkos megúszta, és a bűntársával együtt nyertek.</p>`; V.outcome = "evil"; }
      else { h += `<p class="big" style="color:var(--green)">ÁRTATLAN volt.</p><p class="big" style="color:var(--red)">A gonoszok nyertek!</p>`; V.outcome = "evil"; }
    }
    h += `<div class="panel small"><b>Szavazatok:</b> ${P.ch.map((sl, j) => `${esc(lab(j))}: ${tally[j]}`).join(" · ")}</div>`;
    if (V.outcome) h += `<button class="btn" id="fin">Megoldás és szerepek</button>`;
    app.innerHTML = h; save();
    tone(V.outcome === "good" ? 660 : 160, 1.2, "triangle", .3);
    if ($("#extra")) $("#extra").onclick = () => { ensureAudio(); V.stage = "extra"; V.extraEnd = Date.now() + 180000 / P.x; save(); voteFlow(); };
    if ($("#g")) $("#g").onclick = () => { V.stage = "guess"; save(); voteFlow(); };
    if ($("#fin")) $("#fin").onclick = () => { V.stage = "final"; save(); voteFlow(); };
  } else if (V.stage === "extra") {
    app.innerHTML = `<div class="center" style="padding-top:4vh"><h1>Még 3 perc!</h1><p>${V.revote ? "A gyilkos még köztetek van. Ki az?" : `Győzzétek meg egymást: ${V.cands.map(j => `<b>${esc(S.chars[P.ch[j]].name)}</b>`).join(" vagy ")}?`}</p>
      <svg id="clock" viewBox="0 0 100 100" style="width:60vw;max-width:260px;height:auto"></svg><button class="btn" id="now">Kész, szavazzunk most</button></div>`;
    const go = () => { clearInterval(V._t); V.stage = "pass"; V.votes = {}; if (V.revote) { V.revote = 0; V.round2 = 0; delete V.lot; delete V.noteShown; } else V.round2 = 1; save(); voteFlow(); };
    $("#now").onclick = go;
    let last = -1;
    V._t = setInterval(() => {
      if (!$("#now")) return clearInterval(V._t);
      const rem = (V.extraEnd - Date.now()) / 1000 * P.x;
      drawClock(rem / 180, false, rem <= 30, rem);
      if (rem <= 60) { const sec = Math.ceil(rem); if (sec !== last) { last = sec; tick(1 - rem / 60); } }
      if (rem <= 0) go();
    }, 200);
  } else if (V.stage === "guess") {
    let sel = null; const j0 = V.conv;
    app.innerHTML = `<h2>${esc(lab(j0))}: ki a szemtanú?</h2><div class="grid">` +
      P.ch.map((sl, j) => j === j0 ? "" : `<div class="c" data-j="${j}">${pimg(S, sl)}<b>${esc(S.chars[sl].name)}</b></div>`).join("") +
      `</div><button class="btn" id="cast" disabled>Ez a tippem</button>`;
    app.querySelectorAll(".grid .c").forEach(e => e.onclick = () => { sel = +e.dataset.j; app.querySelectorAll(".grid .c").forEach(x => x.classList.toggle("on", x === e)); $("#cast").disabled = false; });
    $("#cast").onclick = () => { V.guess = sel; V.outcome = roleOf(sel) === "S" ? "evil" : "good"; V.stage = "guessed"; save(); voteFlow(); };
  } else if (V.stage === "guessed") {
    const ok = V.outcome === "evil";
    app.innerHTML = `<div class="center flip">${pimg(S, P.ch[V.guess], {cls: "pfp"})}</div><p class="big">${esc(S.chars[P.ch[V.guess]].name)}</p>
      <p class="big" style="color:${ok ? "var(--red)" : "var(--green)"}">${ok ? "Eltalálta a szemtanút! A gonoszok nyertek!" : "Nem ő a szemtanú. Az ártatlanok nyertek!"}</p><button class="btn" id="fin">Megoldás és szerepek</button>`;
    tone(ok ? 160 : 660, 1.2, "triangle", .3);
    $("#fin").onclick = () => { V.stage = "final"; save(); voteFlow(); };
  } else {
    let h = `<p class="big" style="color:${V.outcome === "good" ? "var(--green)" : "var(--red)"}">${V.outcome === "good" ? "Az ártatlanok nyertek!" : "A gonoszok nyertek!"}</p>
      <div class="panel"><h3>Mi történt valójában</h3><p>${esc(S.solution)}</p></div><h3>Ki kicsoda volt</h3><div class="grid">`;
    P.ch.forEach((sl, j) => { const c = S.chars[sl], ev = c.role === "G" || c.role === "B"; h += `<div class="c">${pimg(S, sl, {evil: ev})}<b>${esc(c.name)}</b><br><span class="badge ${ev ? "red" : c.role === "S" ? "blue" : ""}">${c.roleName}</span></div>`; });
    h += `</div><div class="panel"><h3>Személyes titkok</h3><p class="small muted">Meséljétek el, ki mit titkolt!</p>` +
      P.ch.map((sl, j) => `<p class="small"><b>${esc(S.chars[sl].name)}</b>: ${esc(S.chars[sl].secret)}</p>`).join("") +
      `</div><button class="btn" id="new">Új játék</button>${bugLink()}`;
    app.innerHTML = h;
    $("#new").onclick = () => { location.hash = ""; location.reload(); };
  }
  window.scrollTo(0, 0);
}

/* ===================== router ===================== */
async function route() {
  const m = location.hash.match(/^#c=(.+)$/);
  if (m) return startGame(m[1]);
  // Márk 2026-10-22: no deep link straight into a story (its narration ran while the page was still loading);
  // every entry lands on the picker, and the story starts only when it is tapped there
  if (location.hash) history.replaceState(null, "", location.href.split("#")[0]);   // absolute: the shop serves this page with a CDN <base href>
  await lobby();
}
window.addEventListener("hashchange", () => location.reload());
route();
</script>
</body>
</html>
